<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Bros Studio</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Inter Variable', -apple-system, system-ui, sans-serif; background: #2a2a2e; }
      /* The app uses INTER_FAMILY = 'Inter Variable' (single variable font, weight axis).
         Register it under the exact same name so the reused renderer matches the app 1:1. */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@latest/latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@latest/latin-wght-italic.woff2') format('woff2-variations');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Several app modules do top-level require('../assets/x.png') for native asset
         resolution. On web that throws "require is not defined" and breaks the module.
         A harmless global require (returns undefined → local-asset lookups fall back to
         remote URLs) lets those modules load. Must run before the module script. -->
    <script>
      window.require = function () { return undefined; };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
